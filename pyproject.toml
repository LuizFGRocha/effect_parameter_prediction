[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gefx"
version = "0.2.0"
description = "Recuperacao de configuracoes de efeitos de guitarra a partir do audio (POC UFMG)"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "librosa",
    "soundfile",
    "audioread",
    "pandas",
    "scikit-image",
    "scikit-learn",
    "joblib",
    "tensorflow[and-cuda]==2.21.0",
    "keras>=3.12",
    "matplotlib",
    "pyloudnorm",
    "pedalboard",
    "spafe",
    "pyyaml",
]

[project.scripts]
gefx = "gefx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gefx*"]
